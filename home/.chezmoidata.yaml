mcp: {}
claudePlugins:
  marketplaces:
    - name: caveman
      url: "https://github.com/JuliusBrussee/caveman"
    - name: mattpocock
      url: "https://github.com/mattpocock/skills"
    - name: claude-plugins-official
      url: "anthropics/claude-plugins-official"
  install:
    - caveman@caveman
    - mattpocock-skills@mattpocock
    - atlassian@claude-plugins-official
    # playwright superseded its hand-rolled mcp.playwright shim above, same
    # move as #44 did for Atlassian: the plugin self-registers the same
    # @playwright/mcp server, so the manual npx entry is redundant now.
    - playwright@claude-plugins-official
    # These 12 accreted by hand on the primary machine over months; listing
    # them is what makes a fresh box (or devbox) actually match instead of
    # only getting caveman/mattpocock-skills/atlassian/playwright.
    - claude-code-setup@claude-plugins-official
    - commit-commands@claude-plugins-official
    - context7@claude-plugins-official
    - frontend-design@claude-plugins-official
    - gopls-lsp@claude-plugins-official
    - learning-output-style@claude-plugins-official
    - pr-review-toolkit@claude-plugins-official
    - ralph-loop@claude-plugins-official
    - remember@claude-plugins-official
    - security-guidance@claude-plugins-official
    - session-report@claude-plugins-official
    - superpowers@claude-plugins-official
    - typescript-lsp@claude-plugins-official
claudeSkillsDir: []
# Individually-extracted upstream skills, installed via the vercel-labs skills
# CLI. Kept separate from claudeSkillsDir because those repos are whole-repo
# clones; these pull one skill folder out of a repo that is mostly something
# else (no-mistakes and lavish-axi are CLI projects that happen to ship a skill).
# Do not add mattpocock/skills here — it arrives via claudePlugins above (its
# repo now ships a marketplace manifest), and declaring it twice loads every
# skill in it twice.
# no-mistakes is deliberately absent: `no-mistakes init` installs its own skill
# at user level, so pulling it from here as well would install it twice.
agentSkills:
  - name: axi
    source: kunchenguid/axi
  - name: lavish
    source: kunchenguid/lavish-axi
  - name: find-skills
    source: vercel-labs/skills
# CLIs the skills above drive. lavish is absent because its skill shells out to
# `npx -y lavish-axi`, so there is nothing to install.
# `version` is the version this repo wants, in the vendor's own tag format —
# bumping it here is both the upgrade and the trigger that re-runs the install
# script. npm rows install exactly it; script rows are vendor curl-pipe
# installers that take no version input, so there the declared value is what
# the result is checked against afterwards rather than something that can be
# handed to the installer (see docs/provisioning.md).
agentClis:
  - name: no-mistakes
    kind: script
    version: v1.60.2
    posixUrl: "https://raw.githubusercontent.com/kunchenguid/no-mistakes/main/docs/install.sh"
    windowsUrl: "https://raw.githubusercontent.com/kunchenguid/no-mistakes/main/docs/install.ps1"
  - name: gnhf
    kind: npm
    version: 0.1.47
    package: gnhf
