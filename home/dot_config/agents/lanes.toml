# Work lanes and weekly pacing, read by `agent-pace` and `agent-eval`.
# A lane is one (provider, model) a task can be dispatched to. Shares are the
# baseline fraction of dispatched tasks; pacing shifts weight between the
# `claude` group (draws the Max plan quota) and the `free` group (does not).

[pacing]
# Aim to end the 7-day window at this percent used, leaving a safety margin.
target_end_pct = 95
# Within this many points of the pace line is "on pace" and shares stay put.
band_pct = 5
# How hard a gap from the pace line moves the claude share (multiplier slope).
gain = 1.5
claude_weight_min = 0.25
claude_weight_max = 2.0
# Claude lanes stop receiving new work at this five-hour percent.
five_hour_pause_pct = 85
# Opus never takes more than this fraction of all dispatches, whatever the pace.
opus_share_cap = 0.20

[classes]
# plan: design and decomposition       impl: bounded code change
# impl-large: multi-file feature       review-fix: apply review findings
# review: read a diff and report       research: gather facts
# spike: time-boxed investigation      docs: writing       test: add tests
# ops: run a procedure                 summarize: read and condense
all = ["plan", "impl", "impl-large", "review-fix", "review", "research", "spike", "docs", "test", "ops", "summarize"]

# Evidence needed before a lane's own results outweigh its prior, and the
# floor of samples a lane gets on R0/R1 work so it can be judged at all.
[evaluation]
prior_weight = 6
min_samples = 8
explore_fraction = 0.15
# A lane that fails for infrastructure reasons this many times in a row is
# skipped for the cooldown, without touching its quality score.
cooldown_failures = 3
cooldown_hours = 2
# Promotion/demotion advice thresholds on the Wilson lower bound of quality.
keep_lb = 0.60
probation_lb = 0.40
promote_lb = 0.75
promote_min_n = 15

# status: active (normal) | explore (R0 only, to be judged) | paused (never).
# max_risk: highest tier the lane may implement; reviews follow the tier rule.
# unavailable_until: ISO date; the lane is skipped before then.

[[lane]]
id = "claude-opus"
group = "claude"
provider = "claudeAgent"
model = "claude-opus-5-5"
family = "anthropic"
status = "active"
share = 10
max_risk = "R3"
concurrency = 3
prior = 0.92
classes = ["plan", "impl", "impl-large", "review", "review-fix", "research", "spike", "ops"]
notes = "Planning, final pre-merge review, security, architecture, and what Sonnet failed."

