# Repositories merge-captain looks after, read by `merge-captain`. A repository
# that is not listed is ignored. Flipping one to live is a one-line edit here.
#
# mode: live    comment, label, review and merge, up to max_tier
#       dry-run classify and log what would happen; writes nothing, runs no reviewer
#       off     ignored
# max_tier: highest risk tier it may merge on its own (R0, R1 or R2). R3 is never
# merged, whatever is written here.
# allow_no_checks: true lets a repository with no CI at all merge; otherwise a
# pull request that reports no checks waits.
# max_prs_per_repo: optional; overrides [limits] max_prs_per_repo for this repository.
# require_token: optional, default false. true holds the repository (waiting,
# token-required, no GitHub call) until its owner has a token file, then runs it
# as usual. It can only withhold; a bad token keeps its own reason. Example:
#   [[repo]]
#   name = "jdwlabs/apps"
#   mode = "dry-run"
#   max_tier = "R2"
#   require_token = true
# approver: optional, default false. true lets the captain approve this repository's
# pull requests as the merge-captain-approver App when its ruleset wants one review and
# everything else is met (R2 or below, an allowed author, no CODEOWNERS path). Needs
# `merge-captain auth-app` first; without the App's key the PR waits as approver-missing.
# Shipped false everywhere: the owner flips it per repository once the App is provisioned.
# rollout: optional, default "none". What shows that a merge the captain made went out well,
# watched only from [rollback] stage 1:
#   none              nothing to watch; the row closes as no-signal
#   ci-only           the push checks on the landed commit
#   release-workflow  rollout_workflow (a workflow file name) run for the landed commit
#   gitops            the landed commit's CI run, then the health_check workflow run its
#                     dispatch-e2e job started in rollout_target (same owner)
# rollout_window_m: optional; minutes to wait for the signal (ci-only 30, release-workflow 60,
# gitops 90).

[limits]
# Caps count only pull requests that need a decision: a draft, a held one or one
# from an author not listed below costs nothing. Live repositories are walked
# before dry-run ones, each group starting where the last run left off, so a
# repository late in this file still gets its turn.
max_prs_per_run = 20
# A separate budget, so reporting on dry-run repositories never starves live work.
max_dry_prs_per_run = 8
max_prs_per_repo = 4
max_reviews_per_run = 2
max_merges_per_hour = 6
# Approvals the App may submit in an hour, across all repositories.
max_approvals_per_hour = 4
review_timeout_s = 300
max_diff_bytes = 150000
# Rollout rows checked in one run.
max_verifies_per_run = 10

[rollback]
# 0 off: no rollout row, check or alert. 1 observe: after each merge, watch the rollout and,
# on a failure, label the pull request needs-human with one comment; nothing is reverted.
# 2 and 3 (reverts) are not built; set either and the captain runs as 1.
stage = 0

[reviewers]
# Providers a review may run on. A lane on any other provider is excluded from
# the lane choice, so a review is never assigned to a lane it cannot run. The
# free opencode models refuse the tool-less invocation a diff review needs, so
# only claudeAgent is listed.
providers = ["claudeAgent"]

[checks]
# Names of checks whose failure is tolerated. Every other failing check blocks
# the merge, required or not.
ignore = []

[authors]
# Only pull requests opened by these logins are touched. A bot is spelled with
# its [bot] suffix whether gh reports it as app/name or name[bot]; a name
# without the suffix matches a person only.
allow = ["jdwillmsen", "jdwlabs-agent-bot[bot]", "renovate[bot]", "dependabot[bot]"]

[[repo]]
name = "jdwillmsen/dotfiles"
mode = "live"
max_tier = "R2"
rollout = "ci-only"

