# Starship prompt. Activated by the `command -v starship` guard in .bashrc, so
# this file only takes effect on machines where run_once_42 installed the binary.
# Glyphs below come from the Nerd Font private use area — run_once_44 installs
# the family, and the terminal must be pointed at it or they render as tofu.

format = """
$username\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[directory]
# Repo-relative paths keep the prompt short inside deep trees; the three-segment
# cap bounds it everywhere else.
truncate_to_repo = true
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"

[cmd_duration]
# Below two seconds the timing is noise and costs a prompt line's worth of width.
min_time = 2000
format = "took [$duration]($style) "
style = "yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# --- Elevated-shell indicator -------------------------------------------------
# The Windows Terminal Git Bash profile sets "elevate": true, so every shell runs
# as Administrator and this module renders on every prompt. That makes it the one
# module here with a real trade-off rather than a cosmetic default, because a
# permanent warning is the kind users stop seeing.
#
# TODO(jdwil): tune the three settings below to how you want elevation surfaced.
#   - `format` — the text. Currently the bare username, which is what produced
#     the "Administrator" you didn't recognise. A literal marker ("⚡ ADMIN",
#     "[root]") reads faster than a name you have to interpret.
#   - `style_root` — how loud. `bold red` is maximum salience; `dimmed yellow`
#     concedes that you've accepted the risk and want it out of the way.
#   - `show_always` — `false` shows it only when elevated, so the indicator
#     carries information. `true` shows it always, which costs width but means a
#     *missing* marker never reads as "not elevated" when the module is broken.
#
# The trade-off: you deliberately chose to keep elevation on, so this marker is
# your only standing cue that everything you run has admin rights. Loud enough to
# notice before a destructive command, quiet enough that you don't filter it out.
[username]
format = "[$user]($style) in "
style_root = "bold red"
style_user = "bold yellow"
show_always = false
