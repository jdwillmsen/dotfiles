# T3 Code spawns each provider CLI by bare name, and a systemd user unit
# inherits none of an interactive shell's PATH — the default reaches neither
# ~/.local/bin (cursor-agent, claude) nor the npm prefix (codex, opencode,
# grok), so every enabled provider fails to spawn.
#
# A drop-in rather than an edit to t3code.service: `npx t3@latest service
# update` regenerates that unit and would drop the setting, but leaves this
# directory alone.
#
# ~/.local/npm-bin is a stable name for a directory that is not: the real npm
# global bin lives under a version-managed node install and moves whenever node
# does. Script 52 keeps the symlink pointed at it. That indirection is what
# makes this file static — an earlier version resolved the prefix at render
# time, which made its content depend on the environment doing the rendering
# and so drift between an apply and a verify.
[Service]
Environment=PATH=%h/.local/npm-bin:%h/.local/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin
